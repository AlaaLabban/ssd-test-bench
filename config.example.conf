# SSD Test Bench — settings.  setup.sh copies this to config.conf; edit config.conf, not this file.
# Plain KEY=value lines. No spaces around "=". Quotes optional.  After editing:
#   sudo systemctl restart ssd-runner ssd-status

# --- The batch ----------------------------------------------------------------
# How many drives you plan to test. Sets how many bay tiles the dashboard draws.
# 0 = don't know / open-ended (the dashboard shows the drives tested so far + 1 empty bay).
EXPECTED_DRIVES=0

# How many of the drives you want to keep. When every expected drive is finished, the
# best KEEP_COUNT clean drives are marked KEEP and the other clean ones SPARE.
# 0 = no keep/spare pick; clean drives are just marked GOOD.
KEEP_COUNT=0

# --- Safety -------------------------------------------------------------------
# no  = DEFAULT, recommended. The runner only does Phase A: a read-only health test.
#       Nothing is ever written to your drives. This is all most people need.
# yes = WIPE MODE. After the read test, every SATA drive is ERASED (ATA secure erase +
#       full write/verify). ALL DATA ON IT IS DESTROYED AND CANNOT BE RECOVERED.
#       Only for drives you are giving away, selling or reusing, and only when EVERY
#       drive you will plug in is meant to be wiped.
AUTO_WIPE=no

# Wipe mode only: seconds of warning (dashboard countdown + phone push) between a drive's
# read test and its wipe. Unplugging during the warning cancels that drive's wipe for good.
# Minimum 30.
WIPE_GRACE_SEC=120

# The runner ignores any drive bigger than this (in GB). 0 = no limit.
# Set it just above your batch size (e.g. 600 for 512 GB drives) so a big backup disk
# plugged in by mistake is never touched.
MAX_GB=0

# Optional: only touch drives whose model matches this regular expression
# (e.g. ^(TOSHIBA|KIOXIA|Micron|Samsung)). Empty = any model.
MODEL_FILTER=

# Serial numbers the runner must never touch, separated by spaces.
PROTECT_SERIALS=

# --- Where things go ----------------------------------------------------------
# Results folder. Empty = "results" inside this kit folder.
RESULTS_DIR=

# --- Dashboard ----------------------------------------------------------------
# 0.0.0.0 = reachable from other devices on your network (phone, laptop).
# 127.0.0.1 = this computer only.
DASH_HOST=0.0.0.0
DASH_PORT=8095
# Drive temperature (°C) the dashboard treats as "hot".
TEMP_WARN=80

# --- Phone notifications (optional) ------------------------------------------
# Any ntfy topic URL, e.g. https://ntfy.sh/some-long-random-topic-name  (install the
# ntfy app on your phone and subscribe to the same topic). Empty = no notifications.
NTFY_URL=
# Only if your ntfy server needs a token.
NTFY_TOKEN=

# --- Advanced -----------------------------------------------------------------
# Temporary ATA password used only during the secure erase (cleared afterwards).
ERASE_PASS=wipe
